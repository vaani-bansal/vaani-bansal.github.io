<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Log</title>
    
    <style>
        /* This is the Styling for the Bookshelf */
        .book-section {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; /* Fun font for kids */
            padding: 20px;
            background-color: #f9fdf9; /* Light minty background */
            text-align: center;
        }

        h2.section-title {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 30px;
        }

        /* The Grid that holds the books */
        .bookshelf {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* The individual Book Card */
        .book-card {
            background: white;
            width: 200px;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Soft shadow */
            transition: transform 0.2s; /* Animation for hovering */
            border: 2px solid #e0e0e0;
        }

        /* Makes the card pop up when you hover over it */
        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-color: #ff99cc; /* Pink border on hover */
        }

        .book-cover {
            width: 100%;
            height: 250px;
            object-fit: cover; /* Keeps image from squishing */
            border-radius: 10px;
            background-color: #ddd; /* Grey placeholder color */
            margin-bottom: 10px;
        }

        .book-title {
            font-size: 1.1em;
            color: #333;
            margin: 10px 0 5px 0;
            font-weight: bold;
        }

        .book-author {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .rating {
            background-color: #fff4e6;
            padding: 5px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .review {
            font-size: 0.9em;
            color: #555;
            font-style: italic;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <section class="book-section">
        <h2 class="section-title">📚 My Reading Adventures</h2>
        
        <div class="bookshelf">
            
            <div class="book-card">
                <img src="images/dolphinsatdaybreak.jpg" alt="Magic Tree House" class="book-cover">
                <h3 class="book-title">Dolphins at Daybreak</h3>
                <p class="book-author">by Mary Pope Osborne</p>
                <div class="rating">⭐⭐⭐⭐</div>
                <p class="review">"I am so glad that Jack and Annie got away from the Hammerhead shark!"</p>
            </div>


        </div>
    </section>
    </body>
</html>
