<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaani's Book Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- COPYING VARIABLES FROM MAIN PAGE --- */
        :root {
            --primary: #6366f1; 
            --secondary: #8b5cf6; 
            --accent: #f43f5e; 
            --bg-color: #f3f4f6;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --white: #ffffff;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.7;
            color: var(--text-dark);
            margin: 0;
            background-color: var(--bg-color);
        }

        a { text-decoration: none; color: inherit; }

        /* --- HEADER --- */
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            /* Reduced bottom padding since we aren't overlapping anymore */
            padding: 3rem 1rem 3rem; 
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */
        header::before {
            content: ''; position: absolute; top: -50px; left: -50px;
            width: 200px; height: 200px; background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        header::after {
            content: ''; position: absolute; bottom: 20px; right: -20px;
            width: 150px; height: 150px; background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        header h1 {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Navigation Button to go back home */
        .home-btn {
            display: inline-block;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            backdrop-filter: blur(5px);
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .home-btn:hover { background: rgba(255, 255, 255, 0.4); }

        /* --- MAIN CONTAINER --- */
        .container {
            max-width: 1000px;
            /* Changed margin to POSITIVE 40px so it sits BELOW the header */
            margin: 40px auto; 
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* --- BOOKSHELF GRID --- */
        .bookshelf {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 25px;
        }

        /* --- INDIVIDUAL BOOK CARD --- */
        .book-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--primary); 
        }

        .book-cover {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #eee;
        }

        .book-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            color: var(--text-dark);
            margin: 5px 0;
            font-weight: 700;
            line-height: 1.3;
        }

        .book-author {
            font-size: 0.9rem;
            color: var(--secondary); 
            margin-bottom: 10px;
            font-weight: 600;
        }

        .rating {
            color: #fbbf24; 
            font-size: 1rem;
            margin-bottom: 12px;
            background: #fffbeb;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            align-self: center;
        }

        .review {
            font-size: 0.9rem;
            color: var(--text-light);
            font-style: italic;
            border-top: 1px solid #f3f4f6;
            padding-top: 10px;
            margin-top: auto; 
        }

        @media (max-width: 600px) {
            .bookshelf { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="home-btn"><i class="fas fa-arrow-left"></i> Back to Main Page</a>
        <h1><i class="fas fa-book-open"></i> My Reading Adventures</h1>
    </header>

    <div class="container">
        <div class="bookshelf">
            <div class="book-card">
                <img src="images/kristysgreatidea.jpg" alt="Another Book" class="book-cover">
                <div class="book-title">Kristy's Great Idea</div>
                <div class="book-author">Ann M. Martin</div>
                <div class="rating">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                </div>
                <p class="review">"Kristy was great at planning and she formed a new club!"</p>
            </div>

            <div class="book-card">
                <img src="images/dolphinsatdaybreak.jpg" alt="Dolphins at Daybreak" class="book-cover">
                <div class="book-title">Dolphins at Daybreak</div>
                <div class="book-author">Mary Pope Osborne</div>
                <div class="rating">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                </div>
                <p class="review">"I am so glad that Jack and Annie got away from the Hammerhead shark!"</p>
            </div>


        </div>
    </div>

</body>
</html>
